<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stannect — Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #edeee7; --brand: #a2825d; --accent-1: #bdbca8; --accent-2: #b4a98f; --accent-3: #ab9576;
        --surface: #f5f5f0; --border: #d8d6cb; --text: #2e2a24; --text-muted: #6b6458;
        --brand-rgb: 162,130,93; --brand-10: rgba(162,130,93,0.1); --brand-30: rgba(162,130,93,0.3);
      }
      [data-theme="dark"] {
        --bg: #1d1a16; --surface: #2a2620; --border: #3a352e; --brand: #b89567;
        --accent-1: #6f6d5e; --accent-2: #7d7461; --accent-3: #8a7559; --text: #e8e6df; --text-muted: #a9a395;
        --brand-rgb: 184,149,103; --brand-10: rgba(184,149,103,0.12); --brand-30: rgba(184,149,103,0.32);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        background: var(--bg); color: var(--text); overflow-x: hidden;
        font-family: "Exo 2", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
        transition: background .4s ease, color .4s ease;
        background-image: radial-gradient(1000px 700px at 78% -8%, var(--brand-10), transparent 60%), radial-gradient(800px 600px at 6% 18%, rgba(var(--brand-rgb),0.06), transparent 55%);
      }
      h1,h2,h3,h4,.heading { font-family: "Poppins","Montserrat",sans-serif; }
      ::selection { background: var(--brand); color: var(--bg); }
      button { font-family: inherit; }

      header { position: fixed; inset: 0 0 auto 0; z-index: 60; backdrop-filter: blur(6px); }
      .bar { max-width: 1320px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
      .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
      .logo img { height: 30px; display: block; }
      .logo-fallback { display: none; align-items: center; gap: 10px; }
      .logo-fallback .chip { width: 36px; height: 36px; border-radius: 12px; background: var(--brand-10); color: var(--brand); display: flex; align-items: center; justify-content: center; }
      .logo-fallback .word { font-family: "Poppins"; font-weight: 600; letter-spacing: .2em; font-size: 18px; }
      .icon-btn { width: 40px; height: 40px; border-radius: 999px; cursor: pointer; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); display: flex; align-items: center; justify-content: center; transition: color .2s; }
      .icon-btn:hover { color: var(--brand); }
      .head-actions { display: flex; align-items: center; gap: 10px; }
      .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
      .seg button { border: none; background: none; cursor: pointer; color: var(--text-muted); width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center; transition: background .2s, color .2s; }
      .seg button.on { background: var(--brand); color: var(--bg); }
      .gridview { position: fixed; inset: 0; z-index: 15; overflow-y: auto; opacity: 0; pointer-events: none; transition: opacity .4s ease; }
      body.mode-grid .gridview { opacity: 1; pointer-events: auto; }
      body.mode-grid .scene { opacity: 0; pointer-events: none; }
      .gv-inner { max-width: 1240px; margin: 0 auto; padding: 104px 24px 80px; }
      .gv-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
      .gv-head h2 { font-size: clamp(24px,3.5vw,32px); font-weight: 600; margin: 0; }
      .gv-head p { color: var(--text-muted); margin: 4px 0 0; max-width: 520px; }
      .gv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px,1fr)); gap: 20px; }
      .gv-card { position: relative; border-radius: 18px; padding: 18px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 18px 50px -22px rgba(0,0,0,.45); cursor: pointer; transition: transform .2s ease, box-shadow .3s ease; animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both; }
      .gv-card:hover { transform: translateY(-4px); box-shadow: 0 0 0 1px var(--brand-10), 0 30px 70px -26px var(--brand-30); }
      .ask { border: 1px solid var(--border); background: var(--brand-10); border-radius: 16px; padding: 14px; margin-bottom: 24px; }
      .ask-row { display: flex; gap: 10px; align-items: center; }
      .ask-ico { width: 34px; height: 34px; border-radius: 10px; background: var(--brand); color: var(--bg); display: flex; align-items: center; justify-content: center; flex: none; }
      .ask-row input { flex: 1; min-width: 0; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit; }
      .ask-answer:empty { display: none; }
      .ask-answer.show { margin-top: 14px; animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both; }
      .ask-answer .a-head { font-family: "Poppins"; font-weight: 600; font-size: 16px; margin-bottom: 8px; }
      .ask-answer ul { margin: 0 0 12px; padding-left: 18px; color: var(--text-muted); font-size: 14px; }
      .ask-answer table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .ask-answer th, .ask-answer td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
      .ask-answer th { color: var(--text-muted); font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: .06em; }
      .ask-note { margin-top: 10px; font-size: 12px; color: var(--text-muted); }
      .typing { display: inline-flex; gap: 4px; padding: 6px 0; }
      .typing span { width: 6px; height: 6px; border-radius: 999px; background: var(--brand); animation: pulse 1.2s ease-in-out infinite; }
      .typing span:nth-child(2) { animation-delay: .2s; }
      .typing span:nth-child(3) { animation-delay: .4s; }
      .btn { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; background: var(--brand); color: var(--bg); border: none; border-radius: 999px; padding: 10px 18px; font-family: "Poppins"; font-weight: 500; font-size: 14px; text-decoration: none; box-shadow: 0 18px 50px -20px rgba(0,0,0,.45); transition: transform .15s; }
      .btn:hover { transform: scale(1.03); } .btn:active { transform: scale(.96); }
      .btn-ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: none; }

      .scene { position: relative; width: 100%; height: 100vh; overflow: hidden; cursor: grab; touch-action: none; transition: opacity .4s ease; }
      .scene.grabbing { cursor: grabbing; }
      .world { position: absolute; inset: 0; z-index: 1; transform-origin: 50% 50%; transition: transform 1s cubic-bezier(.7,0,.2,1), filter 1s ease; will-change: transform, filter; pointer-events: none; }
      .world canvas { width: 100%; height: 100%; display: block; }
      .world::before { content: ""; position: absolute; left: 50%; top: 50%; width: 94%; height: 94%; transform: translate(-50%,-50%); border-radius: 50%; background: radial-gradient(circle, rgba(var(--brand-rgb),0.18), rgba(var(--brand-rgb),0.05) 42%, transparent 64%); pointer-events: none; }

      .intro { position: absolute; top: 88px; left: 0; right: 0; text-align: center; z-index: 6; pointer-events: none; padding: 0 24px; transition: opacity .4s; }
      .intro .pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 999px; padding: 7px 18px; font-size: 12px; text-transform: uppercase; letter-spacing: .28em; color: var(--text-muted); background: var(--surface); font-family: "Poppins"; }
      .intro .hint { margin: 12px auto 0; font-size: 13px; color: var(--text-muted); opacity: .8; }
      .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--brand); animation: pulse 3.5s ease-in-out infinite; }

      .toolbar { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; gap: 12px; align-items: center; transition: opacity .4s; }

      .summary { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 20; pointer-events: none; opacity: 0; transition: opacity .35s; text-align: center; }
      .summary.show { opacity: 1; }
      .summary .box { display: inline-block; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 16px; box-shadow: 0 18px 50px -20px rgba(0,0,0,.45); }
      .summary .big { font-family: "Poppins"; font-weight: 600; font-size: 18px; }
      .summary .sm { font-size: 12px; color: var(--text-muted); }

      .orbit { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
      #chains { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 1; }
      .ocard {
        position: absolute; width: 226px; border-radius: 18px; padding: 16px; cursor: pointer; z-index: 2; pointer-events: auto;
        background: var(--surface); border: 1px solid var(--border); box-shadow: 0 22px 60px -22px rgba(0,0,0,.6);
        transition: box-shadow .3s; will-change: transform, left, top, filter; transform: translate(-50%,-50%);
      }
      .ocard:hover { box-shadow: 0 0 0 1px var(--brand-10), 0 32px 84px -26px var(--brand-30); }
      .ocard .rule { position: absolute; left: 16px; right: 16px; top: 0; height: 1px; }
      .ocard-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
      .ocard-ico { width: 38px; height: 38px; border-radius: 11px; background: var(--brand-10); color: var(--brand); display: flex; align-items: center; justify-content: center; flex: none; }
      .ocard h3 { font-size: 15px; font-weight: 600; margin: 0; line-height: 1.15; }
      .ocard .sub { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); }
      .ocard .lead-val { font-family: "Poppins"; font-size: 26px; font-weight: 600; line-height: 1; }
      .ocard .lead-lbl { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
      .ocard .mini { width: 100%; height: 22px; display: block; margin-top: 8px; }
      .ocard .open-hint { margin-top: 12px; font-size: 12px; color: var(--brand); opacity: 0; transition: opacity .25s; display: flex; align-items: center; gap: 6px; }
      .ocard:hover .open-hint { opacity: 1; }
      .ocard .ctl { position: absolute; top: 9px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); opacity: 0; transition: opacity .2s, color .2s; background: none; border: none; cursor: pointer; padding: 4px; }
      .ocard:hover .ctl { opacity: .85; } .ocard .ctl:hover { color: var(--brand); opacity: 1; }
      .ocard .ctl.star { left: 9px; } .ocard .ctl.x { right: 9px; }
      .ocard .ctl.star.on { opacity: 1; color: var(--brand); }
      .ocard .badge { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--brand); color: var(--bg); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; display: none; }
      .ocard.primary .badge { display: block; }

      .chain-core { fill: none; stroke: var(--brand); stroke-opacity: .16; stroke-width: 1.2; }
      .chain-link { fill: none; stroke: var(--brand); stroke-width: 1.5; }
      .chain-anchor { fill: var(--brand); }
      .shot-core { fill: none; stroke: var(--brand); stroke-opacity: .55; stroke-width: 2; filter: drop-shadow(0 0 5px var(--brand)); }
      @keyframes shotdraw { to { stroke-dashoffset: 0; } }
      @keyframes shotpop { from { opacity: 0; } to { opacity: 1; } }
      .chain-pulse { fill: var(--brand); }

      #bloom { position: fixed; left: 50%; top: 50%; width: 40px; height: 40px; border-radius: 50%; transform: translate(-50%,-50%) scale(1); background: radial-gradient(circle, var(--brand) 0%, transparent 68%); opacity: 0; pointer-events: none; z-index: 45; }
      #bloom.go { animation: bloom .9s ease-out forwards; }

      .detail { position: fixed; inset: 0; z-index: 50; overflow-y: auto; opacity: 0; pointer-events: none; transition: opacity .5s ease; }
      body.in-dash .detail { opacity: 1; pointer-events: auto; }
      body.in-dash .world { transform: scale(2.6) !important; filter: blur(3px) brightness(1.08); }
      body.in-dash .orbit, body.in-dash .intro, body.in-dash .toolbar, body.in-dash .summary { opacity: 0; pointer-events: none; }
      body.in-dash .scene { cursor: default; }
      .detail-bg { position: fixed; inset: 0; background: var(--bg); opacity: 1; z-index: -1; }
      .detail-inner { max-width: 1240px; margin: 0 auto; padding: 96px 24px 80px; }
      .detail.arriving .detail-inner { animation: arrive .85s cubic-bezier(.22,1,.36,1) both; }
      .dhead { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-bottom: 8px; }
      .dhead .globe-accent { width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--brand), transparent 70%), var(--surface); border: 1px solid var(--border); box-shadow: 0 0 24px -6px var(--brand-30); flex: none; }
      .dhead h2 { font-size: clamp(24px,3.5vw,34px); font-weight: 600; margin: 0; }
      .dhead .dsub { color: var(--text-muted); font-size: 14px; margin-top: 2px; }
      .pills { display: inline-flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px; margin-left: auto; }
      .pills button { border: none; background: none; cursor: pointer; color: var(--text-muted); border-radius: 999px; padding: 6px 14px; font-size: 13px; }
      .pills button.active { background: var(--brand); color: var(--bg); }
      .detail-desc { color: var(--text-muted); max-width: 640px; margin: 6px 0 28px; }
      .kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 16px; }
      .ktile { position: relative; border-radius: 16px; padding: 18px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 18px 50px -22px rgba(0,0,0,.4); animation: fadeUp .45s cubic-bezier(.22,1,.36,1) both; }
      .ktile .klabel { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; }
      .ktile .kval { font-family: "Poppins"; font-size: 30px; font-weight: 600; line-height: 1.1; margin-top: 8px; }
      .ktile .kdelta { font-size: 12px; margin-top: 6px; font-weight: 500; }
      .ktile .kspark { width: 100%; height: 26px; display: block; margin-top: 10px; }
      .ktile .kx { position: absolute; top: 12px; right: 12px; color: var(--text-muted); opacity: 0; cursor: pointer; transition: opacity .2s; }
      .ktile:hover .kx { opacity: .8; } .ktile .kx:hover { color: var(--brand); }
      .ktile.add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border-style: dashed; color: var(--text-muted); background: transparent; min-height: 120px; transition: color .2s, border-color .2s; }
      .ktile.add:hover { color: var(--brand); border-color: var(--brand); }

      .pop { position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%); width: 300px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; box-shadow: 0 18px 50px -20px rgba(0,0,0,.45); animation: fadeUp .35s cubic-bezier(.22,1,.36,1) both; }
      .pop[hidden] { display: none; }
      .pop label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .08em; }
      .pop input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; }
      .pop .row { display: flex; gap: 8px; margin-top: 10px; } .pop .row .btn { flex: 1; justify-content: center; }

      .modal-wrap { position: fixed; inset: 0; z-index: 70; display: none; align-items: flex-start; justify-content: center; background: rgba(0,0,0,.4); backdrop-filter: blur(3px); padding: 80px 20px; overflow-y: auto; }
      .modal-wrap.show { display: flex; }
      .modal { width: 100%; max-width: 640px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 24px; box-shadow: 0 30px 80px -30px rgba(0,0,0,.6); animation: fadeUp .4s cubic-bezier(.22,1,.36,1) both; }
      .modal h3 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
      .modal .msub { color: var(--text-muted); font-size: 14px; margin-bottom: 18px; }
      .group-title { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--brand); margin: 16px 0 8px; }
      .metric-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px,1fr)); gap: 8px; }
      .metric-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); cursor: pointer; background: var(--surface); transition: border-color .2s, background .2s; }
      .metric-item:hover { border-color: var(--brand); }
      .metric-item.added { background: var(--brand-10); border-color: var(--brand-30); }
      .metric-item .mi-check { width: 18px; height: 18px; border-radius: 6px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--brand); flex: none; }
      .metric-item.added .mi-check { background: var(--brand); color: var(--bg); border-color: var(--brand); }
      .metric-item .mi-name { font-size: 13px; line-height: 1.2; }

      @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
      @keyframes fadeUp { 0% { opacity: 0; transform: translateY(14px) scale(.98); } 100% { opacity: 1; transform: none; } }
      @keyframes bloom { 0% { opacity: 0; transform: translate(-50%,-50%) scale(1); } 18% { opacity: .6; } 100% { opacity: 0; transform: translate(-50%,-50%) scale(58); } }
      @keyframes arrive { 0% { opacity: 0; transform: translateY(34px) scale(1.06); filter: blur(9px); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; filter: none; } }
      @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; } }
      @media (max-width: 720px) { .ocard { width: 176px; padding: 13px; } }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <a class="logo" href="#" id="logo-link">
          <img id="logo-img" alt="Stannect" src="https://images.leadconnectorhq.com/image/f_webp/q_80/r_1200/u_https://assets.cdn.filesafe.space/TQJOdU4270StImOTr6lM/media/64260d24-9ea1-4c9f-bc5c-80878076faa5.png" onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex';" />
          <span class="logo-fallback" id="logo-fallback">
            <span class="chip"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="9.5" width="9" height="5" rx="2.5"/><rect x="12" y="9.5" width="9" height="5" rx="2.5"/></svg></span>
            <span class="word">STANNECT</span>
          </span>
        </a>
        <div class="head-actions">
          <div class="seg" id="mode-seg">
            <button data-mode="world" class="on" title="Globe view" aria-label="Globe view"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 2.6 15.4 0 18M12 3c-2.6 2.6-2.6 15.4 0 18"/></svg></button>
            <button data-mode="grid" title="Grid view" aria-label="Grid view"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg></button>
          </div>
          <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme"></button>
        </div>
      </div>
    </header>

    <div class="scene" id="scene">
      <div class="world" id="world"><canvas></canvas></div>
      <div class="summary" id="summary"><div class="box"><div class="big" id="sum-big"></div><div class="sm" id="sum-sm"></div></div></div>
      <div class="intro" id="intro">
        <span class="pill"><span class="dot"></span> Stannect Command Center</span>
        <div class="hint">Drag to orbit the world · click a dashboard to step inside · ★ sets your primary</div>
      </div>
      <div class="orbit" id="orbit"><svg id="chains" aria-hidden="true"></svg></div>
      <div class="toolbar" id="toolbar">
        <div style="position:relative">
          <button class="btn" id="add-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Add dashboard</button>
          <div class="pop" id="add-pop" hidden>
            <label for="dash-name">Name your dashboard</label>
            <input id="dash-name" type="text" placeholder="e.g. Dashboard Sarah" autocomplete="off" />
            <div class="row"><button class="btn btn-ghost" id="add-cancel">Cancel</button><button class="btn" id="add-create">Create</button></div>
          </div>
        </div>
      </div>
    </div>

    <div class="gridview" id="gridview">
      <div class="gv-inner">
        <div class="gv-head">
          <div><h2>Your Dashboards</h2><p>A clean, logistics-first view. Click any dashboard to open its KPIs.</p></div>
          <button class="btn" id="gv-add"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Add dashboard</button>
        </div>
        <div class="gv-grid" id="gv-grid"></div>
      </div>
    </div>

    <div id="bloom"></div>
    <div class="detail" id="detail"><div class="detail-bg"></div><div class="detail-inner" id="detail-inner"></div></div>
    <div class="modal-wrap" id="metric-modal">
      <div class="modal">
        <h3>Connect a metric</h3>
        <div class="msub">Pull any KPI from the Stannect intelligence layer into this dashboard.</div>
        <div id="metric-groups"></div>
        <div style="margin-top:20px;text-align:right"><button class="btn" id="metric-done">Done</button></div>
      </div>
    </div>

    <script>
      (function () {

            var by = omu * omu * y0 + 2 * omu * u * my + u * u * y1;
            var tgx = 2 * omu * (mx - x0) + 2 * u * (x1 - mx), tgy = 2 * omu * (my - y0) + 2 * u * (y1 - my);
            var ang = Math.atan2(tgy, tgx) * 180 / Math.PI + (k % 2 ? 90 : 0);
            rects += '<rect class="chain-link" x="-5.5" y="-2.75" width="11" height="5.5" rx="2.6" transform="translate(' + bx.toFixed(1) + ' ' + by.toFixed(1) + ') rotate(' + ang.toFixed(1) + ')" style="animation:shotpop .22s ease both;animation-delay:' + (k * 0.02).toFixed(3) + 's"></rect>';
          }
          chains.innerHTML = '<path class="shot-core" d="' + d + '" style="stroke-dasharray:' + len.toFixed(0) + ';stroke-dashoffset:' + len.toFixed(0) + ';animation:shotdraw .42s ease forwards"></path>' + rects;
        }
        function selectDash(id) {
          if (document.body.classList.contains("mode-grid")) { openDash(id); return; }
          var nd = null; for (var c = 0; c < nodes.length; c++) if (nodes[c].d.id === id) nd = nodes[c];
          var srect = scene.getBoundingClientRect(), tx = ballX, ty = ballY;
          if (nd) { var rr = nd.el.getBoundingClientRect(); tx = rr.left + rr.width / 2 - srect.left; ty = rr.top + rr.height / 2 - srect.top; }
          drawShot(ballX, ballY, tx, ty);
          bloom.style.left = (srect.left + ballX) + "px"; bloom.style.top = (srect.top + ballY) + "px";
          setTimeout(function () {
            bloom.classList.remove("go"); void bloom.offsetWidth; bloom.classList.add("go");
            openDash(id);
            setTimeout(function () { chains.innerHTML = ""; }, 700);
          }, 520);
        }

        function askStannect(q, el) {
          el.className = "ask-answer show";
          el.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
          setTimeout(function () {
            var a = mockAnswer(q);
            var pts = a.points.map(function (p) { return "<li>" + p + "</li>"; }).join("");
            var rows = a.contacts.map(function (c) { return "<tr><td>" + c[0] + "</td><td>" + c[1] + "</td><td>" + c[2] + "</td></tr>"; }).join("");
            el.className = "ask-answer show";
            el.innerHTML = '<div class="a-head">' + a.headline + "</div><ul>" + pts + "</ul>" +
              '<table><thead><tr><th>Contact</th><th>Amount</th><th>Status</th></tr></thead><tbody>' + rows + "</tbody></table>" +
              '<div class="ask-note">Demo response from sample data. Connect your GHL / JobTread data to make this live.</div>';
          }, 850);
        }
        function mockAnswer(q) {
          q = (q || "").toLowerCase();
          if (q.indexOf("estimate") >= 0 || q.indexOf("won") >= 0) {
            return { headline: "318 estimates sent — 20.6% of 1,540 leads; 87 won (27.4%).",
              points: ["Win rate on estimates sent: 27.4% (87 of 318)", "Average won deal: $11,800 · total closed $182k", "Top source for won estimates: LinkedIn ($74k)"],
              contacts: [["Alvarez Roofing Co.", "$22,500", "Won"], ["Hartmann Exteriors", "$14,200", "Sent"], ["Delgado Residence", "$9,800", "Won"], ["Pinecrest HOA", "$31,000", "Sent"]] };
          }
          if (q.indexOf("lead") >= 0 || q.indexOf("speed") >= 0) {
            return { headline: "1,540 new leads — median speed to lead 4m 12s.",
              points: ["Contact rate 68% · lead → appointment 31%", "Close rate 38% · revenue per lead $312", "Cost per acquisition $355 (−6%)"],
              contacts: [["Meridian Builders", "—", "New"], ["Coastal Exteriors", "—", "Contacted"], ["J. Whitman", "—", "Booked"]] };
          }
          return { headline: "Here's a snapshot from your connected data.",
            points: ["Contacts 1,204 · Estimates sent 318 · Won 87", "Closed revenue $182k (+12.4%)", "Try asking about estimates, leads, speed to lead, or revenue."],
            contacts: [["Alvarez Roofing Co.", "$22,500", "Won"], ["Hartmann Exteriors", "$14,200", "Sent"]] };
        }
        function ktileHtml(key) {
          var k = CAT[key]; if (!k) return "";
          var arrow = k.up === true ? "▲" : k.up === false ? "▼" : "";
          var color = k.good ? "var(--brand)" : "var(--text-muted)";
          return '<div class="ktile"><button class="kx" data-rmk="' + key + '">' + icons.close + '</button><div class="klabel">' + k.label + '</div><div class="kval">' + k.val + '</div>' + (k.delta ? '<div class="kdelta" style="color:' + color + '">' + arrow + ' ' + k.delta + '</div>' : '') + (k.spark ? spark(k.spark, 26) : '') + '</div>';
        }
        function renderDetail(id) {
          var d = dashboards.filter(function (x) { return x.id === id; })[0]; if (!d) return;
          var inner = document.getElementById("detail-inner");
          inner.innerHTML =
            '<button class="btn btn-ghost" id="back-btn" style="margin-bottom:24px">' + icons.back + ' Workspace</button>' +
            '<div class="dhead"><span class="globe-accent"></span><div><h2>' + d.name + (d.id === primaryId ? ' <span style="font-size:12px;color:var(--brand)">★ Primary</span>' : '') + '</h2><div class="dsub">' + d.sub + '</div></div><div class="pills"><button>Daily</button><button>Weekly</button><button class="active">Monthly</button><button>90 days</button></div></div>' +
            '<p class="detail-desc">Your live performance picture. Add or connect any metric from the Stannect intelligence layer — contacts, estimates, conversion, cost, touchpoints and more.</p>' +
            '<div class="ask"><div class="ask-row"><span class="ask-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.7 5.6L19 9l-5.3 1.4L12 16l-1.7-5.6L5 9l5.3-1.4z"/></svg></span><input id="ask-input" autocomplete="off" placeholder="Ask Stannect — e.g. what % of estimates were sent, and to which contacts?" /><button class="btn" id="ask-send">Ask</button></div><div class="ask-answer" id="ask-answer"></div></div>' +
            '<div class="kgrid">' + d.kpis.map(ktileHtml).join("") + '<div class="ktile add" id="add-metric"><div style="font-size:24px;line-height:1">+</div><div>Connect a metric</div></div></div>';
          document.getElementById("back-btn").addEventListener("click", closeDash);
          document.getElementById("add-metric").addEventListener("click", openMetricModal);
          var askIn = document.getElementById("ask-input"), askBtn = document.getElementById("ask-send"), askAns = document.getElementById("ask-answer");
          function runAsk() { var q = (askIn.value || "").trim(); if (q) askStannect(q, askAns); }
          askBtn.addEventListener("click", runAsk);
          askIn.addEventListener("keydown", function (e) { if (e.key === "Enter") runAsk(); });
          inner.querySelectorAll("[data-rmk]").forEach(function (b) { b.addEventListener("click", function () { d.kpis = d.kpis.filter(function (k) { return k !== b.getAttribute("data-rmk"); }); renderDetail(id); }); });
          inner.querySelectorAll(".pills button").forEach(function (p) { p.addEventListener("click", function () { inner.querySelectorAll(".pills button").forEach(function (q) { q.classList.remove("active"); }); p.classList.add("active"); }); });
        }
        var detail = document.getElementById("detail");
        function openDash(id) { activeId = id; renderDetail(id); document.body.classList.add("in-dash"); detail.classList.remove("arriving"); void detail.offsetWidth; detail.classList.add("arriving"); detail.scrollTop = 0; }
        function closeDash() { document.body.classList.remove("in-dash"); activeId = null; }

        var modal = document.getElementById("metric-modal");
        function openMetricModal() {
          var d = dashboards.filter(function (x) { return x.id === activeId; })[0]; if (!d) return;
          document.getElementById("metric-groups").innerHTML = GROUPS.map(function (g) {
            return '<div class="group-title">' + g.name + '</div><div class="metric-list">' + g.keys.map(function (key) { var added = d.kpis.indexOf(key) >= 0; return '<div class="metric-item' + (added ? " added" : "") + '" data-key="' + key + '"><span class="mi-check">' + (added ? icons.check : "") + '</span><span class="mi-name">' + CAT[key].label + '</span></div>'; }).join("") + '</div>';
          }).join("");
          modal.classList.add("show");
          document.getElementById("metric-groups").querySelectorAll(".metric-item").forEach(function (it) {
            it.addEventListener("click", function () { var key = it.getAttribute("data-key"); if (d.kpis.indexOf(key) >= 0) d.kpis = d.kpis.filter(function (k) { return k !== key; }); else d.kpis.push(key); renderDetail(activeId); openMetricModal(); });
          });
        }
        document.getElementById("metric-done").addEventListener("click", function () { modal.classList.remove("show"); });
        modal.addEventListener("click", function (e) { if (e.target === modal) modal.classList.remove("show"); });

        var addBtn = document.getElementById("add-btn"), addPop = document.getElementById("add-pop"), nameInput = document.getElementById("dash-name");
        function openAdd(o) { addPop.hidden = !o; if (o) { nameInput.value = ""; setTimeout(function () { nameInput.focus(); }, 30); } }
        addBtn.addEventListener("click", function (e) { e.stopPropagation(); openAdd(addPop.hidden); });
        addBtn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
        addPop.addEventListener("click", function (e) { e.stopPropagation(); });
        addPop.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
        document.getElementById("add-cancel").addEventListener("click", function () { openAdd(false); });
        function createDash() { var name = (nameInput.value || "").trim() || "New Dashboard"; if (!/^dashboard/i.test(name)) name = "Dashboard " + name; dashboards.push({ id: nid(), name: name, sub: "Custom dashboard", kind: "dashboard", accent: ((dashboards.length % 3) + 1), kpis: EXEC.slice(0, 8) }); openAdd(false); renderOrbit(); updateSummary(); }
        document.getElementById("add-create").addEventListener("click", createDash);
        nameInput.addEventListener("keydown", function (e) { if (e.key === "Enter") createDash(); });
        document.addEventListener("click", function () { openAdd(false); });
        document.addEventListener("keydown", function (e) { if (e.key === "Escape") { openAdd(false); modal.classList.remove("show"); if (document.body.classList.contains("in-dash")) closeDash(); } });

        function updateSummary() { document.getElementById("sum-big").textContent = dashboards.length + " connected dashboards"; document.getElementById("sum-sm").textContent = CAT.contacts.val + " contacts · " + CAT.estimatesWon.val + " estimates won · " + CAT.closedRevenue.val + " closed"; }

        // grid (logistics) view
        var gvGrid = document.getElementById("gv-grid");
        function gridCardHtml(d) {
          var lead = CAT[d.kpis.indexOf("closedRevenue") >= 0 ? "closedRevenue" : d.kpis[0]];
          var ic = d.kind === "integration" ? icons.integration : icons.dashboard;
          var isP = d.id === primaryId;
          return '<div class="gv-card' + (isP ? " primary" : "") + '" data-id="' + d.id + '">' +
            '<span class="badge">Primary</span><span class="rule" style="background:' + accentVar(d.accent) + '"></span>' +
            '<button class="ctl star' + (isP ? " on" : "") + '" data-star="' + d.id + '" title="Set as primary">' + (isP ? icons.starOn : icons.star) + '</button>' +
            '<button class="ctl x" data-del="' + d.id + '" title="Remove">' + icons.close + '</button>' +
            '<div class="ocard-head"><span class="ocard-ico">' + ic + '</span><div><h3>' + d.name + '</h3><div class="sub">' + d.sub + '</div></div></div>' +
            '<div class="lead-val">' + lead.val + '</div><div class="lead-lbl">' + lead.label + '</div>' +
            (lead.spark ? spark(lead.spark, 22) : '') +
            '<div class="open-hint">Open dashboard ' + icons.arrow + '</div></div>';
        }
        function renderGrid() {
          var od = order();
          gvGrid.innerHTML = od.map(gridCardHtml).join("");
          gvGrid.querySelectorAll(".gv-card").forEach(function (el) { el.addEventListener("click", function () { selectDash(el.getAttribute("data-id")); }); });
          gvGrid.querySelectorAll("[data-star]").forEach(function (b) { b.addEventListener("click", function (e) { e.stopPropagation(); setPrimary(b.getAttribute("data-star")); }); });
          gvGrid.querySelectorAll("[data-del]").forEach(function (b) { b.addEventListener("click", function (e) { e.stopPropagation(); var id = b.getAttribute("data-del"); dashboards = dashboards.filter(function (x) { return x.id !== id; }); if (primaryId === id && dashboards[0]) primaryId = dashboards[0].id; renderGrid(); renderOrbit(); updateSummary(); }); });
        }
        document.getElementById("gv-add").addEventListener("click", function () {
          var name = (window.prompt("Name your dashboard", "Dashboard ") || "").trim();
          if (!name) return;
          if (!/^dashboard/i.test(name)) name = "Dashboard " + name;
          dashboards.push({ id: nid(), name: name, sub: "Custom dashboard", kind: "dashboard", accent: ((dashboards.length % 3) + 1), kpis: EXEC.slice(0, 8) });
          renderGrid(); renderOrbit(); updateSummary();
        });

        // mode toggle (gamified world ⇄ logistics grid)
        var modeSeg = document.getElementById("mode-seg");
        var mode = "world";
        try { var sm = localStorage.getItem("stannect-mode"); if (sm === "grid" || sm === "world") mode = sm; } catch (e) {}
        function applyMode() {
          document.body.classList.toggle("mode-grid", mode === "grid");
          modeSeg.querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-mode") === mode); });
          if (mode === "grid") renderGrid();
        }
        modeSeg.querySelectorAll("button").forEach(function (b) {
          b.addEventListener("click", function () {
            mode = b.getAttribute("data-mode");
            try { localStorage.setItem("stannect-mode", mode); } catch (e) {}
            if (document.body.classList.contains("in-dash")) closeDash();
            chains.innerHTML = "";
            applyMode();
          });
        });

        renderOrbit(); updateSummary(); applyMode();
      })();
    </script>
  </body>
</html>
