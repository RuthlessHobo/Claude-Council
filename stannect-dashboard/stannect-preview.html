<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stannect — Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #edeee7; --brand: #a2825d; --accent-1: #bdbca8; --accent-2: #b4a98f; --accent-3: #ab9576;
        --surface: #f5f5f0; --border: #d8d6cb; --text: #2e2a24; --text-muted: #6b6458;
        --brand-rgb: 162,130,93; --brand-10: rgba(162,130,93,0.1); --brand-30: rgba(162,130,93,0.3);
      }
      [data-theme="dark"] {
        --bg: #1d1a16; --surface: #2a2620; --border: #3a352e; --brand: #b89567;
        --accent-1: #6f6d5e; --accent-2: #7d7461; --accent-3: #8a7559; --text: #e8e6df; --text-muted: #a9a395;
        --brand-rgb: 184,149,103; --brand-10: rgba(184,149,103,0.12); --brand-30: rgba(184,149,103,0.32);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        background: var(--bg); color: var(--text); overflow-x: hidden;
        font-family: "Exo 2", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
        transition: background .4s ease, color .4s ease;
        background-image: radial-gradient(900px 600px at 78% -8%, var(--brand-10), transparent 60%), radial-gradient(700px 520px at 6% 18%, rgba(var(--brand-rgb),0.06), transparent 55%);
      }
      h1,h2,h3,h4,.heading { font-family: "Poppins","Montserrat",sans-serif; }
      ::selection { background: var(--brand); color: var(--bg); }
      button { font-family: inherit; }

      header { position: fixed; inset: 0 0 auto 0; z-index: 60; backdrop-filter: blur(6px); }
      .bar { max-width: 1240px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
      .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
      .logo img { height: 30px; display: block; }
      .logo-fallback { display: none; align-items: center; gap: 10px; }
      .logo-fallback .chip { width: 36px; height: 36px; border-radius: 12px; background: var(--brand-10); color: var(--brand); display: flex; align-items: center; justify-content: center; }
      .logo-fallback .word { font-family: "Poppins"; font-weight: 600; letter-spacing: .2em; font-size: 18px; }
      .icon-btn { width: 40px; height: 40px; border-radius: 999px; cursor: pointer; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); display: flex; align-items: center; justify-content: center; transition: color .2s; }
      .icon-btn:hover { color: var(--brand); }
      .btn { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; background: var(--brand); color: var(--bg); border: none; border-radius: 999px; padding: 10px 18px; font-family: "Poppins"; font-weight: 500; font-size: 14px; text-decoration: none; box-shadow: 0 18px 50px -20px rgba(0,0,0,.45); transition: transform .15s; }
      .btn:hover { transform: scale(1.03); } .btn:active { transform: scale(.96); }
      .btn-ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: none; }

      .scene { position: relative; width: 100%; height: 100vh; overflow: hidden; }
      .world { position: absolute; inset: 0; z-index: 1; transform-origin: 50% 50%; transition: transform .95s cubic-bezier(.7,0,.2,1), filter .95s ease; will-change: transform, filter; }
      .world canvas { width: 100%; height: 100%; display: block; }
      .world-hot { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); border-radius: 50%; z-index: 4; cursor: pointer; }

      .intro { position: absolute; top: 90px; left: 0; right: 0; text-align: center; z-index: 6; pointer-events: none; padding: 0 24px; transition: opacity .4s; }
      .intro .pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 999px; padding: 6px 16px; font-size: 11px; text-transform: uppercase; letter-spacing: .25em; color: var(--text-muted); margin-bottom: 14px; background: var(--surface); }
      .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--brand); animation: pulse 3.5s ease-in-out infinite; }
      .intro h1 { font-size: clamp(28px,4.5vw,46px); font-weight: 600; margin: 0; line-height: 1.05; }
      .intro h1 .accent { color: var(--brand); }
      .intro p { margin: 10px auto 0; max-width: 520px; color: var(--text-muted); font-size: 15px; }

      .toolbar { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; gap: 12px; align-items: center; transition: opacity .4s; }

      .summary { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 20; pointer-events: none; opacity: 0; transition: opacity .35s; text-align: center; }
      .summary.show { opacity: 1; }
      .summary .box { display: inline-block; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 16px; box-shadow: 0 18px 50px -20px rgba(0,0,0,.45); }
      .summary .big { font-family: "Poppins"; font-weight: 600; font-size: 18px; }
      .summary .sm { font-size: 12px; color: var(--text-muted); }

      .orbit { position: absolute; inset: 0; z-index: 10; }
      #chains, #fx { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
      #chains { z-index: 1; } #fx { z-index: 35; }
      .ocard {
        position: absolute; width: 234px; border-radius: 18px; padding: 16px; cursor: pointer; z-index: 2;
        background: var(--surface); border: 1px solid var(--border); box-shadow: 0 20px 55px -22px rgba(0,0,0,.55);
        transition: box-shadow .3s; will-change: transform, left, top, filter; transform: translate(-50%,-50%);
      }
      .ocard:hover { box-shadow: 0 0 0 1px var(--brand-10), 0 30px 80px -26px var(--brand-30); }
      .ocard .rule { position: absolute; left: 16px; right: 16px; top: 0; height: 1px; }
      .ocard-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
      .ocard-ico { width: 38px; height: 38px; border-radius: 11px; background: var(--brand-10); color: var(--brand); display: flex; align-items: center; justify-content: center; flex: none; }
      .ocard h3 { font-size: 15px; font-weight: 600; margin: 0; line-height: 1.15; }
      .ocard .sub { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); }
      .ocard .lead-val { font-family: "Poppins"; font-size: 26px; font-weight: 600; line-height: 1; }
      .ocard .lead-lbl { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
      .ocard .mini { width: 100%; height: 22px; display: block; margin-top: 8px; }
      .ocard .open-hint { margin-top: 12px; font-size: 12px; color: var(--brand); opacity: 0; transition: opacity .25s; display: flex; align-items: center; gap: 6px; }
      .ocard:hover .open-hint { opacity: 1; }
      .ocard .ctl { position: absolute; top: 9px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); opacity: 0; transition: opacity .2s, color .2s; background: none; border: none; cursor: pointer; padding: 4px; }
      .ocard:hover .ctl { opacity: .8; } .ocard .ctl:hover { color: var(--brand); opacity: 1; }
      .ocard .ctl.star { left: 9px; } .ocard .ctl.x { right: 9px; }
      .ocard .ctl.star.on { opacity: 1; color: var(--brand); }
      .ocard .badge { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--brand); color: var(--bg); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; display: none; }
      .ocard.primary .badge { display: block; }

      .shot-core { fill: none; stroke: var(--brand); stroke-width: 2; stroke-linecap: round; filter: drop-shadow(0 0 6px var(--brand)); }
      .shot-pulse { fill: var(--brand); filter: drop-shadow(0 0 5px var(--brand)); }
      .chain-core { fill: none; stroke: var(--brand); stroke-opacity: .2; stroke-width: 1.5; }
      .chain-links { fill: none; stroke: var(--brand); stroke-opacity: .6; stroke-width: 4; stroke-linecap: round; stroke-dasharray: .5 11; animation: dash 1.6s linear infinite; }
      .chain-anchor { fill: var(--brand); }
      .chain-pulse { fill: var(--brand); }

      #bloom { position: fixed; left: 50%; top: 50%; width: 40px; height: 40px; border-radius: 50%; transform: translate(-50%,-50%) scale(1); background: radial-gradient(circle, var(--brand) 0%, transparent 68%); opacity: 0; pointer-events: none; z-index: 45; }
      #bloom.go { animation: bloom .85s ease-out forwards; }

      /* Detail */
      .detail { position: fixed; inset: 0; z-index: 50; overflow-y: auto; opacity: 0; pointer-events: none; transition: opacity .5s ease; }
      body.in-dash .detail { opacity: 1; pointer-events: auto; }
      body.in-dash .world { transform: scale(2.4) !important; filter: blur(3px) brightness(1.08); }
      body.in-dash .orbit, body.in-dash .intro, body.in-dash .toolbar, body.in-dash .summary { opacity: 0; pointer-events: none; }
      .detail-bg { position: fixed; inset: 0; background: var(--bg); opacity: .86; z-index: -1; }
      .detail-inner { max-width: 1240px; margin: 0 auto; padding: 96px 24px 80px; }
      .detail.arriving .detail-inner { animation: arrive .85s cubic-bezier(.22,1,.36,1) both; }
      .dhead { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-bottom: 8px; }
      .dhead .globe-accent { width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--brand), transparent 70%), var(--surface); border: 1px solid var(--border); box-shadow: 0 0 24px -6px var(--brand-30); flex: none; }
      .dhead h2 { font-size: clamp(24px,3.5vw,34px); font-weight: 600; margin: 0; }
      .dhead .dsub { color: var(--text-muted); font-size: 14px; margin-top: 2px; }
      .pills { display: inline-flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px; margin-left: auto; }
      .pills button { border: none; background: none; cursor: pointer; color: var(--text-muted); border-radius: 999px; padding: 6px 14px; font-size: 13px; }
      .pills button.active { background: var(--brand); color: var(--bg); }
      .detail-desc { color: var(--text-muted); max-width: 640px; margin: 6px 0 28px; }
      .kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 16px; }
      .ktile { position: relative; border-radius: 16px; padding: 18px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 18px 50px -22px rgba(0,0,0,.4); animation: fadeUp .45s cubic-bezier(.22,1,.36,1) both; }
      .ktile .klabel { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; }
      .ktile .kval { font-family: "Poppins"; font-size: 30px; font-weight: 600; line-height: 1.1; margin-top: 8px; }
      .ktile .kdelta { font-size: 12px; margin-top: 6px; font-weight: 500; }
      .ktile .kspark { width: 100%; height: 26px; display: block; margin-top: 10px; }
      .ktile .kx { position: absolute; top: 12px; right: 12px; color: var(--text-muted); opacity: 0; cursor: pointer; transition: opacity .2s; }
      .ktile:hover .kx { opacity: .8; } .ktile .kx:hover { color: var(--brand); }
      .ktile.add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border-style: dashed; color: var(--text-muted); background: transparent; min-height: 120px; transition: color .2s, border-color .2s; }
      .ktile.add:hover { color: var(--brand); border-color: var(--brand); }

      .pop { position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%); width: 300px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; box-shadow: 0 18px 50px -20px rgba(0,0,0,.45); animation: fadeUp .35s cubic-bezier(.22,1,.36,1) both; }
      .pop[hidden] { display: none; }
      .pop label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .08em; }
      .pop input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; }
      .pop .row { display: flex; gap: 8px; margin-top: 10px; } .pop .row .btn { flex: 1; justify-content: center; }

      .modal-wrap { position: fixed; inset: 0; z-index: 70; display: none; align-items: flex-start; justify-content: center; background: rgba(0,0,0,.4); backdrop-filter: blur(3px); padding: 80px 20px; overflow-y: auto; }
      .modal-wrap.show { display: flex; }
      .modal { width: 100%; max-width: 640px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 24px; box-shadow: 0 30px 80px -30px rgba(0,0,0,.6); animation: fadeUp .4s cubic-bezier(.22,1,.36,1) both; }
      .modal h3 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
      .modal .msub { color: var(--text-muted); font-size: 14px; margin-bottom: 18px; }
      .group-title { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--brand); margin: 16px 0 8px; }
      .metric-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px,1fr)); gap: 8px; }
      .metric-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); cursor: pointer; background: var(--surface); transition: border-color .2s, background .2s; }
      .metric-item:hover { border-color: var(--brand); }
      .metric-item.added { background: var(--brand-10); border-color: var(--brand-30); }
      .metric-item .mi-check { width: 18px; height: 18px; border-radius: 6px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--brand); flex: none; }
      .metric-item.added .mi-check { background: var(--brand); color: var(--bg); border-color: var(--brand); }
      .metric-item .mi-name { font-size: 13px; line-height: 1.2; }

      @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
      @keyframes fadeUp { 0% { opacity: 0; transform: translateY(14px) scale(.98); } 100% { opacity: 1; transform: none; } }
      @keyframes dash { to { stroke-dashoffset: -24; } }
      @keyframes bloom { 0% { opacity: 0; transform: translate(-50%,-50%) scale(1); } 18% { opacity: .6; } 100% { opacity: 0; transform: translate(-50%,-50%) scale(55); } }
      @keyframes arrive { 0% { opacity: 0; transform: translateY(34px) scale(1.06); filter: blur(9px); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; filter: none; } }
      @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; } }
      @media (max-width: 720px) { .ocard { width: 184px; padding: 13px; } .intro h1 { font-size: 25px; } }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <a class="logo" href="#" id="logo-link">
          <img id="logo-img" alt="Stannect" src="https://images.leadconnectorhq.com/image/f_webp/q_80/r_1200/u_https://assets.cdn.filesafe.space/TQJOdU4270StImOTr6lM/media/64260d24-9ea1-4c9f-bc5c-80878076faa5.png" onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex';" />
          <span class="logo-fallback" id="logo-fallback">
            <span class="chip"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="9.5" width="9" height="5" rx="2.5"/><rect x="12" y="9.5" width="9" height="5" rx="2.5"/></svg></span>
            <span class="word">STANNECT</span>
          </span>
        </a>
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme"></button>
      </div>
    </header>

    <div class="scene" id="scene">
      <div class="world" id="world"><canvas></canvas></div>
      <div class="world-hot" id="world-hot" aria-hidden="true"></div>
      <div class="summary" id="summary"><div class="box"><div class="big" id="sum-big"></div><div class="sm" id="sum-sm"></div></div></div>
      <div class="intro" id="intro">
        <span class="pill"><span class="dot"></span> Stannect Command Center</span>
        <h1>Where your business meets <span class="accent">automation</span></h1>
        <p>Move around the world to explore your dashboards — click one to step inside its KPIs.</p>
      </div>
      <div class="orbit" id="orbit"><svg id="chains" aria-hidden="true"></svg></div>
      <svg id="fx" aria-hidden="true"><path id="shot-path" class="shot-core" d=""></path></svg>
      <div class="toolbar" id="toolbar">
        <div style="position:relative">
          <button class="btn" id="add-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Add dashboard</button>
          <div class="pop" id="add-pop" hidden>
            <label for="dash-name">Name your dashboard</label>
            <input id="dash-name" type="text" placeholder="e.g. Dashboard Sarah" autocomplete="off" />
            <div class="row"><button class="btn btn-ghost" id="add-cancel">Cancel</button><button class="btn" id="add-create">Create</button></div>
          </div>
        </div>
      </div>
    </div>

    <div id="bloom"></div>

    <div class="detail" id="detail"><div class="detail-bg"></div><div class="detail-inner" id="detail-inner"></div></div>

    <div class="modal-wrap" id="metric-modal">
      <div class="modal">
        <h3>Connect a metric</h3>
        <div class="msub">Pull any KPI from the Stannect intelligence layer into this dashboard.</div>
        <div id="metric-groups"></div>
        <div style="margin-top:20px;text-align:right"><button class="btn" id="metric-done">Done</button></div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var html = document.documentElement;

        /* Theme */
        var sun = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>';
        var moon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8z"/></svg>';
        try { var sv = localStorage.getItem("stannect-theme"); if (sv) html.setAttribute("data-theme", sv); } catch (e) {}
        var toggle = document.getElementById("theme-toggle");
        function paint() { toggle.innerHTML = html.getAttribute("data-theme") === "dark" ? sun : moon; }
        paint();
        toggle.addEventListener("click", function () { var n = html.getAttribute("data-theme") === "dark" ? "light" : "dark"; html.setAttribute("data-theme", n); try { localStorage.setItem("stannect-theme", n); } catch (e) {} paint(); });

        var icons = {
          dashboard: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
          integration: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 6H15.5M6 8.5V15a3 3 0 0 0 3 3h6.5"/></svg>',
          star: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3l2.7 5.5 6 .9-4.3 4.2 1 6-5.4-2.8L6.6 19.6l1-6L3.3 9.4l6-.9z"/></svg>',
          starOn: '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3l2.7 5.5 6 .9-4.3 4.2 1 6-5.4-2.8L6.6 19.6l1-6L3.3 9.4l6-.9z"/></svg>',
          close: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
          check: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>',
          arrow: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
          back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>'
        };
        function accentVar(n) { return n === 2 ? "var(--accent-2)" : n === 3 ? "var(--accent-3)" : "var(--accent-1)"; }

        /* KPI catalog (from Stannect KPI research) */
        var CAT = {
          contacts:{label:"Contacts",val:"1,204",delta:"+46",up:true,good:true,spark:[60,72,68,80,86,90,98,110]},
          estimatesSent:{label:"Estimates Sent",val:"318",delta:"+12",up:true,good:true,spark:[18,22,20,26,28,30,34,38]},
          estimatesWon:{label:"Estimates Won",val:"87",delta:"+5",up:true,good:true,spark:[6,8,7,10,11,12,14,16]},
          totalLeads:{label:"Total New Leads",val:"1,540",delta:"+8.1%",up:true,good:true,spark:[80,92,88,104,112,108,124,140]},
          speedToLead:{label:"Speed to Lead (median)",val:"4m 12s",delta:"−38s",up:false,good:true},
          contactRate:{label:"Contact Rate",val:"68%",delta:"+3.2%",up:true,good:true},

        document.addEventListener("keydown", function (e) { if (e.key === "Escape") { openAdd(false); modal.classList.remove("show"); if (document.body.classList.contains("in-dash")) closeDash(); } });

        function updateSummary() { document.getElementById("sum-big").textContent = dashboards.length + " connected dashboards"; document.getElementById("sum-sm").textContent = CAT.contacts.val + " contacts · " + CAT.estimatesWon.val + " estimates won · " + CAT.closedRevenue.val + " closed"; }

        renderOrbit(); updateSummary();
      })();
    </script>
  </body>
</html>
